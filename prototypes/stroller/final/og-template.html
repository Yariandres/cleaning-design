<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>OG template 1200x630</title><link rel="stylesheet" href="../base.css"><style>
html,body{margin:0}body{width:1200px;height:630px;overflow:hidden;background:var(--p50);padding:0}
.og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 440px;gap:48px;padding:56px 64px;box-sizing:border-box}
.og .logo{height:56px;width:auto;display:block}
.og .copy{display:grid;align-content:space-between}
.og h1{font:800 64px/1.04 var(--display);letter-spacing:-.015em;color:var(--n900);margin:0;text-wrap:balance} /* slot: page title, max 3 lines, 64px; shrink to 54px for 4 lines */
.og .meta{display:flex;gap:14px;align-items:center;font:700 24px var(--body);color:var(--p700);white-space:nowrap}
.og .meta i{width:10px;height:10px;border-radius:50%;background:var(--s300);display:block}
.og .photo{border-radius:24px;overflow:hidden}.og .ph{height:100%;border-radius:24px;font-size:20px}
</style></head><body><div class="og"><div class="copy"><img class="logo" src="../assets/logo.svg" alt="Nowiutko"><h1 data-slot="title">Pranie wózków i fotelików w Poznaniu</h1><div class="meta"><span>U Ciebie w domu</span><i></i><span>tego samego dnia</span></div></div><div class="photo" data-slot="photo"><div class="ph">miejsce na własne zdjęcie<br>(przycięcie 440 × 518, bez ludzi)</div></div></div></body></html>
